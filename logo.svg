      <g transform="rotate(60)">  <path d="M0,-195 Q45,-175 40,-130 Q0,-110 -35,-140 Q-30,-180 0,-195Z" transform="rotate(30 0 -160)"/> <circle cx="0" cy="-118" r="14" fill="#3d6b35" transform="rotate(60 0 0)"/></g>
      <g transform="rotate(120)"> <path d="M0,-195 Q45,-175 40,-130 Q0,-110 -35,-140 Q-30,-180 0,-195Z" transform="rotate(30 0 -160)"/> <circle cx="0" cy="-118" r="14" fill="#3d6b35" transform="rotate(60 0 0)"/></g>
      <g transform="rotate(180)"> <path d="M0,-195 Q45,-175 40,-130 Q0,-110 -35,-140 Q-30,-180 0,-195Z" transform="rotate(30 0 -160)"/> <circle cx="0" cy="-118" r="14" fill="#3d6b35" transform="rotate(60 0 0)"/></g>
