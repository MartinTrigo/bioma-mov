<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="AMA Gestión Económica">
  <!-- AMA · Gestión Económica.
       Tres barras que suben de la tierra al verde, y un brote saliendo de la
       más alta: la economía de lo que se cultiva, no la economía a secas.
       Misma paleta que el resto del ecosistema AMA para que se lean como
       familia, pero sin las hojas en círculo del logo de Bioma: esta app deja
       de ser de un solo proyecto. -->
  <circle cx="256" cy="256" r="256" fill="#faf8f2"/>

  <!-- La tierra de donde salen -->
  <rect x="104" y="376" width="304" height="14" rx="7" fill="#b98a4a" opacity=".45"/>

  <!-- Las barras: de tierra a verde, de menor a mayor -->
  <rect x="120" y="286" width="68" height="90"  rx="14" fill="#d9b382"/>
  <rect x="222" y="226" width="68" height="150" rx="14" fill="#b98a4a"/>
  <rect x="324" y="166" width="68" height="210" rx="14" fill="#5a8a4a"/>

  <!-- El brote, sobre la barra más alta -->
  <g fill="none" stroke="#3d6b35" stroke-width="13" stroke-linecap="round">
    <path d="M358,166 V96"/>
  </g>
  <g fill="#3d6b35">
    <!-- hoja izquierda -->
    <path d="M356,124 Q312,120 300,86 Q340,74 356,108 Z"/>
    <!-- hoja derecha, un poco más arriba -->
    <path d="M360,106 Q404,100 416,64 Q374,54 360,90 Z"/>
  </g>
</svg>
